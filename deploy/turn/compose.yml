services:
  coturn:
    image: coturn/coturn:4.18.0-r0
    user: '${TURN_UID:?Run configure.mjs first}:${TURN_GID:?Run configure.mjs first}'
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    # The official turnserver binary carries this file capability.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    tmpfs: [/tmp]
    volumes:
      - ./generated:/etc/coturn:ro
    command: ['-c', '/etc/coturn/turnserver.conf']
  credentials:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file: .env
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
  https:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_HOST: ${TURN_HOST:?Run configure.mjs first}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
