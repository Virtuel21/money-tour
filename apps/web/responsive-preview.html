<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Money Tour — contrôle responsive</title>
    <style>
      body {
        margin: 0;
        background: #e7eeee;
        display: grid;
        place-items: start center;
      }
      iframe {
        border: 0;
        width: 390px;
        height: 844px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <iframe title="Money Tour sur écran mobile" src="/?scenario=showcase"></iframe>
    <script>
      const q = new URLSearchParams(location.search);
      const f = document.querySelector('iframe');
      f.style.width = (Number(q.get('w')) || 390) + 'px';
      f.style.height = (Number(q.get('h')) || 844) + 'px';
      f.src = '/?scenario=' + (q.get('scenario') || 'showcase');
    </script>
  </body>
</html>
